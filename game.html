<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>Game Control Panel</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: #202225;
                color: #f6f6f7;
                margin: 0;
                padding: 20px;
            }

            .tabs {
                display: flex;
                border-bottom: 2px solid #2f3136;
                margin-bottom: 20px;
            }

            .tab-btn {
                background: none;
                border: none;
                color: #b9bbbe;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                transition: 0.2s;
            }

            .tab-btn:hover {
                color: #fff;
            }

            .tab-btn.active {
                color: #fff;
                border-bottom: 3px solid #5865f2;
                font-weight: bold;
            }

            .tab-content {
                display: none;
                background: #2f3136;
                padding: 20px;
                border-radius: 8px;
            }

            .tab-content.active {
                display: block;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                color: #b9bbbe;
            }

            input {
                width: 100%;
                padding: 10px;
                background: #202225;
                border: 1px solid #202225;
                border-radius: 4px;
                color: #fff;
                box-sizing: border-box;
            }

            button {
                background: #5865f2;
                color: #fff;
                border: none;
                padding: 10px 15px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                margin-right: 5px;
            }

            button:hover {
                background: #4752c4;
            }

            button.danger {
                background: #ed4245;
            }

            button.danger:hover {
                background: #c93b3e;
            }

            .list-box {
                background: #202225;
                padding: 10px;
                border-radius: 4px;
                height: 250px;
                overflow-y: auto;
            }

            .player-item {
                padding: 8px;
                margin-bottom: 5px;
                background: #2f3136;
                border-radius: 4px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        </style>
    </head>

    <body>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('main')">Main Control</button>
            <button class="tab-btn" onclick="switchTab('players')">Players Setup</button>
        </div>
        <!-- MAIN TAB -->
        <div id="main" class="tab-content active">
            <h3>Server Connection</h3>
            <div class="form-group">
                <label>Server IP / Host</label>
                <input type="text" id="serverIp" value="petter.xserver.me">
            </div>
            <div class="form-group">
                <label>Port</label>
                <input type="number" id="serverPort" value="8080">
            </div>
            <div class="form-group">
                <label>Game Version</label>
                <input type="text" id="serverVersion" value="1.21.1">
            </div>
            <div style="margin-bottom: 25px;">
                <button onclick="joinSelectedPlayers()">Join Loaded Players</button>
                <button class="danger" onclick="removeSelectedPlayers()">Disconnect Loaded Players</button>
            </div>
            <h3>Spam Configuration</h3>
            <div class="form-group">
                <label>Spam Message</label>
                <input type="text" id="spamMsg" value="hello" oninput="updateSpamMessage()">
            </div>
            <button onclick="startSpamming()">Start Spamming</button>
            <button class="danger" onclick="stopSpamming()">Stop Spamming</button>
        </div>
        <!-- PLAYERS TAB -->
        <div id="players" class="tab-content">
            <h3>Manage Target Profiles</h3>
            <div class="form-group">
                <label>Add Single Player Name</label>
                <input type="text" id="newPlayerName" placeholder="Enter username...">
                <button style="margin-top: 10px;" onclick="addSinglePlayer()">Add Player</button>
            </div>
            <hr style="border: 1px solid #202225; margin: 20px 0;">
            <div class="form-group">
                <button onclick="promptRandomGeneration()">Generate Random Names</button>
            </div>
            <h4>Loaded Profiles Stack</h4>
            <div class="list-box" id="playerListStack"></div>
        </div>
        <script>
            let playersList = ['petter'];

            function switchTab(tabId) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

                document.getElementById(tabId).classList.add('active');
                event.target.classList.add('active');

                if (tabId === 'players') renderPlayerList();
            }

            function renderPlayerList() {
                const container = document.getElementById('playerListStack');
                container.innerHTML = '';
                playersList.forEach((name, index) => {
                    container.innerHTML += `
                    <div class="player-item">
                        <span>${name}</span>
                        <button class="danger" style="padding: 4px 8px; font-size:12px;" onclick="removePlayer(${index})">Remove</button>
                    </div>
                `;
                });
            }

            function addSinglePlayer() {
                const input = document.getElementById('newPlayerName');
                const name = input.value.trim();
                if (name && !playersList.includes(name)) {
                    playersList.push(name);
                    input.value = '';
                    renderPlayerList();
                }
            }

            function removePlayer(index) {
                fetch('/api/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ players: [playersList[index]] })
                });
                playersList.splice(index, 1);
                renderPlayerList();
            }

            function promptRandomGeneration() {
                const amountStr = prompt("How many random profiles would you like to generate?", "5");
                const amount = parseInt(amountStr);
                if (isNaN(amount) || amount <= 0) return;

                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                for (let i = 0; i < amount; i++) {
                    let randomName = '';
                    for (let j = 0; j < 8; j++) {
                        randomName += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    if (!playersList.includes(randomName)) playersList.push(randomName);
                }
                renderPlayerList();
            }

            function joinSelectedPlayers() {
                fetch('/api/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: document.getElementById('serverIp').value,
                        port: document.getElementById('serverPort').value,
                        version: document.getElementById('serverVersion').value,
                        players: playersList
                    })
                });
            }

            function removeSelectedPlayers() {
                fetch('/api/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ players: playersList })
                });
            }

            function updateSpamMessage() {
                fetch('/api/spam/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: document.getElementById('spamMsg').value })
                });
            }

            function startSpamming() {
                fetch('/api/spam/start', { method: 'POST' });
            }

            function stopSpamming() {
                fetch('/api/spam/stop', { method: 'POST' });
            }
        </script>
    </body>

</html>
